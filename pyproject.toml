[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coga-grpo"
version = "0.1.0"
description = "Correctness-Gated Allocation GRPO for efficient multimodal reasoning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=1.2",
  "av>=13",
  "datasets>=3.2",
  "decord>=0.6.0",
  "deepspeed>=0.15",
  "librosa>=0.10",
  "matplotlib>=3.8",
  "math-verify>=0.5",
  "nltk>=3.9",
  "numpy>=1.26",
  "openai-whisper>=20240930",
  "peft>=0.14",
  "pillow>=10",
  "pycocotools>=2.0.8",
  "pyyaml>=6",
  "qwen-omni-utils>=0.0.4",
  "rouge-score>=0.1.2",
  "requests>=2.32",
  "torch>=2.5",
  "torchvision>=0.20",
  "tqdm>=4.66",
  "transformers>=4.51",
  "trl>=0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
